[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-episodic-reflection-distiller"
version = "0.1.0"
description = "Offline memory distiller synthesizing raw trajectories into reusable procedural heuristics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-episodic-reflection-distiller = "agent_episodic_reflection_distiller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_episodic_reflection_distiller*"]
